# ============================================================
# IntelliWatch — Railway Deployment Config
# Backend: FastAPI + Uvicorn (Python 3.11)
# Database: Neon Postgres (set DATABASE_URL in Railway vars)
# ============================================================

[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/auth/registration-status"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Railway sets $PORT automatically.
# Required env vars to set in Railway dashboard:
#   INTELLIWATCH_SECRET_KEY   — 64-char hex string
#   DATABASE_URL              — Neon postgres connection string
#   INTELLIWATCH_CORS_ORIGINS — your Vercel frontend URL
#   FIREBASE_PROJECT_ID       — optional, for Google/Phone login
