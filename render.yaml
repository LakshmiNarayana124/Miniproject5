services:
  - type: web
    name: intelliwatch-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /auth/registration-status
    envVars:
      - key: INTELLIWATCH_SECRET_KEY
        generateValue: false
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INTELLIWATCH_CORS_ORIGINS
        value: https://intelliwatch-iw.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: intelliwatch-66ad0
      - key: INTELLIWATCH_HOST
        value: "0.0.0.0"
      - key: PYTHON_VERSION
        value: "3.11.9"
