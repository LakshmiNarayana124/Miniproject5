services:
  - type: web
    name: intelliwatch-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: INTELLIWATCH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste Neon connection string in Render dashboard
      - key: INTELLIWATCH_CORS_ORIGINS
        sync: false          # paste Vercel frontend URL after it deploys
      - key: FIREBASE_PROJECT_ID
        value: intelliwatch-66ad0
      - key: PYTHON_VERSION
        value: "3.11.9"
