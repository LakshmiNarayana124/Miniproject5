services:
  - type: web
    name: intelliwatch-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: INTELLIWATCH_SECRET_KEY
        generateValue: true
      - key: INTELLIWATCH_CORS_ORIGINS
        value: https://frontend-five-kappa-31.vercel.app
      - key: DATABASE_URL
        sync: false
