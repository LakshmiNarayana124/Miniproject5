<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#7B4F00"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="60%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#5D3A00"/>
    </radialGradient>
    <radialGradient id="jewel" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#B2EBF2"/>
      <stop offset="70%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#004D40"/>
    </radialGradient>
    <radialGradient id="eye1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="50%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="31" stroke="#FFD700" stroke-width="0.5" fill="none" opacity="0.25"/>

  <!-- Main outer ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#g1)" stroke-width="2.5" fill="none"/>
  <circle cx="32" cy="32" r="26.5" stroke="#B8860B" stroke-width="0.6" fill="none" opacity="0.6"/>

  <!-- Middle ring -->
  <circle cx="32" cy="32" r="19" stroke="url(#g1)" stroke-width="2" fill="none"/>
  <circle cx="32" cy="32" r="17.2" stroke="#B8860B" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="10" stroke="url(#g1)" stroke-width="1.8" fill="url(#hub)"/>
  <circle cx="32" cy="32" r="8.2" stroke="#FFD700" stroke-width="0.6" fill="none" opacity="0.6"/>

  <!-- Center jewel (peacock eye) -->
  <circle cx="32" cy="32" r="4.5" fill="url(#jewel)"/>
  <circle cx="32" cy="32" r="2.5" fill="#004D40"/>
  <circle cx="30.8" cy="30.8" r="1.1" fill="white" fill-opacity="0.75"/>

  <!-- 24 spokes (peacock feather pattern) -->
  <g stroke="url(#g2)" stroke-linecap="round">
    <!-- 8 main spokes thick -->
    <line x1="32" y1="22" x2="32" y2="4"   stroke-width="1.6"/>
    <line x1="43.66" y1="26.34" x2="55.97" y2="14.03" stroke-width="1.6"/>
    <line x1="42" y1="32" x2="60" y2="32"  stroke-width="1.6"/>
    <line x1="43.66" y1="37.66" x2="55.97" y2="49.97" stroke-width="1.6"/>
    <line x1="32" y1="42" x2="32" y2="60"  stroke-width="1.6"/>
    <line x1="20.34" y1="37.66" x2="8.03" y2="49.97" stroke-width="1.6"/>
    <line x1="22" y1="32" x2="4" y2="32"   stroke-width="1.6"/>
    <line x1="20.34" y1="26.34" x2="8.03" y2="14.03" stroke-width="1.6"/>
    <!-- 16 secondary spokes thinner -->
    <line x1="35.21" y1="22.78" x2="43.5" y2="6.2"   stroke-width="0.9" opacity="0.8"/>
    <line x1="41.22" y1="28.79" x2="57.8" y2="20.5"  stroke-width="0.9" opacity="0.8"/>
    <line x1="41.22" y1="35.21" x2="57.8" y2="43.5"  stroke-width="0.9" opacity="0.8"/>
    <line x1="35.21" y1="41.22" x2="43.5" y2="57.8"  stroke-width="0.9" opacity="0.8"/>
    <line x1="28.79" y1="41.22" x2="20.5" y2="57.8"  stroke-width="0.9" opacity="0.8"/>
    <line x1="22.78" y1="35.21" x2="6.2" y2="43.5"   stroke-width="0.9" opacity="0.8"/>
    <line x1="22.78" y1="28.79" x2="6.2" y2="20.5"   stroke-width="0.9" opacity="0.8"/>
    <line x1="28.79" y1="22.78" x2="20.5" y2="6.2"   stroke-width="0.9" opacity="0.8"/>
    <!-- 8 fine intermediate spokes -->
    <line x1="33.6"  y1="22.3" x2="38.5" y2="5.5"    stroke-width="0.6" opacity="0.6"/>
    <line x1="41.7"  y1="30.4" x2="58.5" y2="25.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="41.7"  y1="33.6" x2="58.5" y2="38.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="33.6"  y1="41.7" x2="38.5" y2="58.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="30.4"  y1="41.7" x2="25.5" y2="58.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="22.3"  y1="33.6" x2="5.5"  y2="38.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="22.3"  y1="30.4" x2="5.5"  y2="25.5"   stroke-width="0.6" opacity="0.6"/>
    <line x1="30.4"  y1="22.3" x2="25.5" y2="5.5"    stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- 24 peacock-eye dots on middle ring -->
  <g fill="url(#eye1)" opacity="0.95">
    <circle cx="32"    cy="13"    r="1.4"/>
    <circle cx="38.5"  cy="14.3"  r="1.1"/>
    <circle cx="43.9"  cy="18"    r="1.1"/>
    <circle cx="47.4"  cy="23.4"  r="1.1"/>
    <circle cx="51"    cy="32"    r="1.4"/>
    <circle cx="47.4"  cy="40.6"  r="1.1"/>
    <circle cx="43.9"  cy="46"    r="1.1"/>
    <circle cx="38.5"  cy="49.7"  r="1.1"/>
    <circle cx="32"    cy="51"    r="1.4"/>
    <circle cx="25.5"  cy="49.7"  r="1.1"/>
    <circle cx="20.1"  cy="46"    r="1.1"/>
    <circle cx="16.6"  cy="40.6"  r="1.1"/>
    <circle cx="13"    cy="32"    r="1.4"/>
    <circle cx="16.6"  cy="23.4"  r="1.1"/>
    <circle cx="20.1"  cy="18"    r="1.1"/>
    <circle cx="25.5"  cy="14.3"  r="1.1"/>
  </g>

  <!-- 24 gold tips on outer ring -->
  <g fill="url(#g1)">
    <polygon points="32,2    29.2,6.5   32,5.2   34.8,6.5"/>
    <polygon points="62,32   57.5,29.2  58.8,32  57.5,34.8"/>
    <polygon points="32,62   34.8,57.5  32,58.8  29.2,57.5"/>
    <polygon points="2,32    6.5,34.8   5.2,32   6.5,29.2"/>
    <polygon points="51.9,12.1  48,15.5  49.8,16.5  50.8,14.5"/>
    <polygon points="51.9,51.9  50.8,49.5 48.8,48   48,49.8"/>
    <polygon points="12.1,51.9  15.5,48.8 16.5,50.5  14.5,51.5"/>
    <polygon points="12.1,12.1  14.5,12.5 15.5,48.8  16.5,15.5"/>
    <polygon points="43.5,5.5   41,9.8   43,10.5  44,8.5"/>
    <polygon points="58.5,43.5  54,41.5  54,43.5  56,43.5"/>
    <polygon points="43.5,58.5  43.5,56  41.5,56  42.5,54"/>
    <polygon points="5.5,43.5   8.5,43.5  10.5,43.5 10.5,41.5"/>
    <polygon points="5.5,20.5   10.5,22.5 10.5,20.5 8.5,20.5"/>
    <polygon points="20.5,5.5   20.5,8.5  22.5,10.5 22.5,8.5"/>
    <polygon points="58.5,20.5  56,20.5  54,22.5  56,22.5"/>
    <polygon points="43.5,58.5  41.5,54  43.5,54  43.5,56"/>
  </g>

</svg>
